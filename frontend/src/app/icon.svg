<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Lynceus</title>
  <!-- The wordmark's logic reduced to a glyph: one half solid, one half seen
       through. An aperture rather than an eye — Lynceus was a lookout, not a
       mascot. Outlines vanish below ~20px, so the split is filled-vs-empty
       inside a ring, which survives a 16px tab strip. -->
  <rect width="32" height="32" rx="7" fill="#0a0f1e"/>
  <path d="M16 6.75A9.25 9.25 0 0 0 16 25.25Z" fill="#e7ecf7"/>
  <circle cx="16" cy="16" r="9.25" fill="none" stroke="#e7ecf7" stroke-width="2"/>
</svg>
